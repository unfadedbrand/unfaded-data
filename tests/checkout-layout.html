<!doctype html><html lang="ru" class="uf-co2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout layout regression — no orders</title>
<link rel="stylesheet" href="https://static.tildacdn.com/css/tilda-cart-fullscreen-1.1.min.css">
<link rel="stylesheet" href="../brand-style.css">
<style>body{margin:0;font:14px Onest,Arial}main{max-width:560px;margin:24px auto;padding:20px}.t706__cartpage{position:static;display:block;padding:0}.t706__cartpage-info-wrapper{display:flex;flex-direction:column}.t706__cartpage-products{min-height:400px}.uf-cr{min-height:160px}input{box-sizing:border-box;width:100%}output{display:block;white-space:pre-wrap;font:12px monospace;background:#edeeee;padding:12px}</style>
<main><h1>Проверка раскладки корзины</h1><p>Изолированный тест. Заказы и запросы оплаты отсутствуют.</p>
<div class="t-form__inputsbox" data-uf-wizard="1" data-active-step="1">
<div class="t-input-group t-input-group_nm" data-uf-step="1" style="display:none"><label>ФИО<input name="Name" value="Проверка макета"></label></div>
<div class="t-input-group t-input-group_em" data-uf-step="1" style="display:none"><label>Email<input name="Email" value="layout@example.invalid"></label></div>
<div data-uf-step="2" style="display:block">НЕАКТИВНЫЙ ШАГ</div>
<div data-uf-step="1" hidden>СКРЫТОЕ ПОЛЕ</div>
<div class="uf-checkout-hidden-field" data-uf-step="1">СЛУЖЕБНОЕ ПОЛЕ</div></div>
<section class="t706__cartpage"><div class="t706__cartpage-info-wrapper"><div class="t706__cartpage-products">Товары</div><div class="uf-cr">CREDITS</div><div class="uf-co2-promo">Промокод</div><div class="t706__cartpage-totals"><div class="t706__cartwin-totalamount">77 300 RUB</div></div></div></section>
<output id="result"></output></main><script>
const q=s=>document.querySelector(s),visible=e=>e.getClientRects().length&&getComputedStyle(e).display!=='none';
function check(){const totals=q('.t706__cartpage-totals'),credits=q('.uf-cr'),promo=q('.uf-co2-promo'),r={
 contactsVisible:[...q('[data-uf-wizard]').querySelectorAll('input')].every(visible),
 inactiveHidden:!visible(q('[data-uf-step="2"]')),explicitHidden:!visible(q('[hidden]'))&&!visible(q('.uf-checkout-hidden-field')),
 inputPreserved:q('[name="Name"]').value==='Проверка макета'&&q('[name="Email"]').value==='layout@example.invalid',
 totalUnchanged:q('.t706__cartwin-totalamount').textContent==='77 300 RUB',
 totalsFollowPromo:totals.getBoundingClientRect().top>=promo.getBoundingClientRect().bottom,
 creditsFollowProducts:credits.getBoundingClientRect().top>=q('.t706__cartpage-products').getBoundingClientRect().bottom,
 staticTotals:getComputedStyle(totals).position==='static',staticCard:getComputedStyle(q('.t706__cartpage-info-wrapper')).position==='static'};
 q('#result').textContent=JSON.stringify(r,null,2);document.documentElement.dataset.test=Object.values(r).every(Boolean)?'passed':'failed';}
addEventListener('resize',check);addEventListener('load',check);check();</script></html>
